<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch AI - Learn German with AI</title>
<style>
body { font-family: Arial; background: #f4f4f4; margin: 0; padding: 20px; }
h1 { text-align: center; }
p { text-align: center; color: #555; }
.card { background: white; padding: 15px; margin: 10px auto; max-width: 500px; border-radius: 10px; box-shadow: 0 2px 5px #ddd; }
button { display: block; margin: 15px auto; padding: 12px 25px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; display: block; margin: 10px auto; }
.center { text-align: center; }
</style>
</head>
<body>

<h1>Deutsch AI 🤖🇩🇪</h1>
<p>Malayalam to German - Type ANY Word</p>

<!-- TRANSLATOR - MAIN FEATURE -->
<div class="card center">
<h2>🤖 AI Translator - ANY Word</h2>
<p>Type English / Malayalam word, get German</p>
<input id="aiInput" type="text" placeholder="Type ANY word: hello, love, school...">
<button onclick="askAI()">Translate - Übersetzen</button>
<p id="aiAnswer" style="font-weight:bold; color:#0066cc; font-size:18px;"></p>
</div>

<!-- TYPE & CHECK -->
<div class="card center">
<h2>✍️ Type & Check Words</h2>
<h3 id="showWord" style="color:#0066cc; font-size:22px;">Coffee / Chaya</h3>
<input id="userAnswer" type="text" placeholder="Type: der Kaffee">
<button onclick="checkWord()">Check - Prüfen</button>
<p id="checkResult"></p>
<p id="scoreText">Score: 0 / 0</p>
<button onclick="nextWord()" style="background:#28a745;">Next Word ➡️</button>
</div>

<!-- PRONUNCIATION -->
<div class="card center">
<h2>🎤 AI Pronunciation Check</h2>
<p>Say: Ich trinke Kaffee</p>
<button onclick="checkPronunciation()">Speak & Check</button>
<p id="pronResult"></p>
</div>

<script>
let words = [
  { eng: "Coffee / Chaya", german: "der kaffee" },
  { eng: "House / Veedu", german: "das haus" },
  { eng: "Book / Pusthakam", german: "das buch" },
  { eng: "Water / Vellam", german: "das wasser" },
  { eng: "Friend / Snehithan", german: "der freund" },
  { eng: "School", german: "die schule" },
  { eng: "Mother / Amma", german: "die mutter" },
  { eng: "Father / Achan", german: "der vater" },
  { eng: "Dog / Patti", german: "der hund" },
  { eng: "Cat / Poocha", german: "die katze" }
];
let currentIndex = 0;
let total = 0;
let correctCount = 0;

// BIG INBUILT DICTIONARY - Works even without internet
let bigDict = {
  "hello": "Hallo!",
  "hi": "Hallo!",
  "love": "die Liebe - Ich liebe dich.",
  "school": "die Schule - Ich gehe zur Schule.",
  "teacher": "der Lehrer",
  "mother": "die Mutter - Meine Mutter ist nett.",
  "father": "der Vater",
  "friend": "der Freund - Mein Freund ist nett.",
  "house": "das Haus - Das Haus ist groß.",
  "book": "das Buch - Ich lese ein Buch.",
  "water": "das Wasser - Ich trinke Wasser.",
  "coffee": "der Kaffee - Ich trinke Kaffee.",
  "tea": "der Tee - Ich trinke Tee.",
  "milk": "die Milch",
  "bread": "das Brot",
  "apple": "der Apfel",
  "dog": "der Hund",
  "cat": "die Katze",
  "car": "das Auto",
  "money": "das Geld",
  "day": "der Tag",
  "night": "die Nacht",
  "good morning": "Guten Morgen!",
  "good night": "Gute Nacht!",
  "thank you": "Danke!",
  "please": "Bitte!",
  "yes": "Ja!",
  "no": "Nein!",
  "how are you": "Wie geht es dir?",
  "i am hungry": "Ich habe Hunger.",
  "i want water": "Ich trinke Wasser.",
  "i love you": "Ich liebe dich.",
  "my name is aleena": "Ich heiße Aleena.",
  "where are you": "Wo bist du?",
  "what is your name": "Wie heißt du?"
};

function askAI(){
  let q = document.getElementById('aiInput').value.trim();
  let ans = document.getElementById('aiAnswer');
  if(!q){
    ans.innerText = 'Type a word first';
    return;
  }
  let lower = q.toLowerCase();
  // 1. Check inbuilt first - instant
  if(bigDict[lower]){
    ans.innerText = 'AI: ' + bigDict[lower];
    return;
  }
  // 2. If not inbuilt, try internet API for ANY word
  ans.innerText = 'AI is thinking...';
  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=en|de')
  .then(function(res){ return res.json(); })
  .then(function(data){
    let german = data.responseData.translatedText;
    ans.innerText = 'AI: ' + german;
  })
  .catch(function(){
    ans.innerText = 'No internet. Try: hello, love, school, mother, friend, book - these work offline.';
  });
}

function checkWord(){
  let user = document.getElementById('userAnswer').value.toLowerCase().trim();
  let correct = words[currentIndex].german;
  let result = document.getElementById('checkResult');
  total++;
  if(user === correct){
    correctCount++;
    result.innerText = 'Richtig! Correct! 🎉 ' + correct;
  } else {
    result.innerText = 'Falsch! Correct is: ' + correct;
  }
  document.getElementById('scoreText').innerText = 'Score: ' + correctCount + ' / ' + total;
}

function nextWord(){
  currentIndex = Math.floor(Math.random() * words.length);
  document.getElementById('showWord').innerText = words[currentIndex].eng;
  document.getElementById('userAnswer').value = '';
  document.getElementById('checkResult').innerText = '';
}

function checkPronunciation(){
  let res = document.getElementById('pronResult');
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'de-DE';
    rec.onresult = function(e){
      let said = e.results[0][0].transcript;
      res.innerText = 'You said: ' + said + ' - Sehr gut! 🎉';
    };
    rec.onerror = function(){ res.innerText = 'Try again'; };
    rec.start();
    res.innerText = 'Listening... Speak now...';
  } else {
    res.innerText = 'Use Chrome on phone for voice.';
  }
}
</script>
</body>
</html>
