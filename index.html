function askAI(){

  if(!q){ ans.innerText = 'Type a word first'; return; }
  let lower = q.toLowerCase().replace(/\s+/g, ' ');
  let manglishDict = {
    "chaya": "der Tee - Ich trinke Tee. (Chaya = Tea)",
    "chayya": "der Tee - Ich trinke Tee.",
    "vellam": "das Wasser - Ich trinke Wasser. (Vellam = Water)",
    "veedu": "das Haus - Das Haus ist groß. (Veedu = House)",
    "pusthakam": "das Buch - Ich lese ein Buch.",
    "snehithan": "der Freund - Mein Freund ist nett.",
    "amma": "die Mutter - Meine Mutter ist nett.",
    "achan": "der Vater - Mein Vater ist nett.",
    "chechi": "die Schwester",
    "chettan": "der Bruder",
    "kunju": "das Baby",
    "kutti": "das Kind",
    "patti": "der Hund",
    "poocha": "die Katze",
    "paal": "die Milch",
    "choru": "der Reis",

    "chandran": "der Mond",

    "rathri": "die Nacht",
    "panam": "das Geld",
    "sneham": "die Liebe",
    "kudumbam": "die Familie"
  };
  if(manglishDict[lower]){ ans.innerText = 'AI: ' + manglishDict[lower]; return; }
  let correctDict = {
    "i am from india": "Ich komme aus Indien.",
    "i am aleena": "Ich bin Aleena.",
    "my name is aleena": "Ich heiße Aleena.",
    "i am from kerala": "Ich komme aus Kerala.",
    "i am a student": "Ich bin Studentin.",
    "i am hungry": "Ich habe Hunger.",
    "i want water": "Ich trinke Wasser.",
    "i love my mother": "Ich liebe meine Mutter.",
    "how are you": "Wie geht es dir?",
    "hello": "Hallo!", "hi": "Hallo!",
    "good morning": "Guten Morgen!", "good night": "Gute Nacht!",
    "thank you": "Danke!", "please": "Bitte!",
    "love": "die Liebe", "school": "die Schule", "mother": "die Mutter",
    "father": "der Vater", "friend": "der Freund", "house": "das Haus",
    "book": "das Buch", "water": "das Wasser", "coffee": "der Kaffee",
    "tea": "der Tee", "india": "Indien", "germany": "Deutschland"
  };
  if(correctDict[lower]){ ans.innerText = 'AI: ' + correctDict[lower]; return; }
  ans.innerText = 'AI is thinking...';
  fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=de&dt=t&q=' + encodeURIComponent(q))
  .then(function(res){ return res.json(); })
  .then(function(data){
    let german = '';
    for(let i=0; i<data[0].length; i++){ german += data[0][i][0]; }
    ans.innerText = 'AI: ' + german;
  })
  .catch(function(){ ans.innerText = 'No internet. Try: chaya, vellam, veedu, amma'; });
}

  if(!text || text==='Type a word first'){ alert('Translate first!'); return; }
  let u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; speechSynthesis.speak(u);
}

  else { result.innerText = 'Falsch! Correct is: ' + correct; }
  document.getElementById('scoreText').innerText = 'Score: ' + correctCount + ' / ' + total;
}
function nextWord(){
  if(usedIndexes.length >= words.length){ usedIndexes = []; alert('A1 Complete! You finished all words! 🎉'); }

  do { r = Math.floor(Math.random() * words.length); } while(usedIndexes.includes(r));
  usedIndexes.push(r);
  currentIndex = r;
  document.getElementById('showWord').innerText = words[currentIndex].eng;
  document.getElementById('wordCount').innerText = 'Word ' + usedIndexes.length + ' / ' + words.length;
  document.getElementById('userAnswer').value = '';
  document.getElementById('checkResult').innerText = '';
}

function hearPron(){
  let text = pronList[pronIndex].de;
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

function nextPron(){
  pronIndex++;
  if(pronIndex >= pronList.length){ pronIndex = 0; alert('You finished all 20 speaking sentences! 🎉 Start again!'); }
  document.getElementById('pronSentence').innerText = pronList[pronIndex].de;
  document.getElementById('pronMeaning').innerText = pronList[pronIndex].en;
  document.getElementById('pronCount').innerText = 'Sentence ' + (pronIndex+1) + ' / 20';
  document.getElementById('pronResult').innerText = '';
}

function checkPronunciation(){
  let res = document.getElementById('pronResult');
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    res.innerText = 'Use Chrome for voice. Laptop mic not working.';
    return;
  }
  let target = pronList[pronIndex].de.toLowerCase();
  let wordsArr = target.split(' ');
  let keyWord = wordsArr[wordsArr.length - 1];
  let firstWord = wordsArr[0];
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'de-DE';
  rec.interimResults = false;
  res.innerText = '🎤 Listening... Say LOUD: ' + pronList[pronIndex].de;
  rec.onresult = function(e){
    let heard = e.results[0][0].transcript.toLowerCase();
    pronTotal++;
    res.innerText = 'You said: ' + heard;
    if(heard.includes(keyWord) || heard.includes(firstWord)){
      pronCorrect++;
      res.innerText += ' - Sehr gut! 🎉 Correct!';
    } else {
      res.innerText += ' - Try again. Key word is: ' + keyWord;
    }
    document.getElementById('pronScore').innerText = 'Speaking Score: ' + pronCorrect + ' / ' + pronTotal;
  };
  rec.onerror = function(e){
    if(e.error === 'not-allowed'){ res.innerText = '❌ Mic blocked! Click Lock icon on top -> Allow Microphone -> Refresh'; }
    else if(e.error === 'no-speech'){ res.innerText = '❌ I heard nothing. Speak LOUDER and closer to laptop.'; }
    else { res.innerText = 'Try again - Error: ' + e.error; }
  };
  rec.start();
}
